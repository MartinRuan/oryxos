name: OryxOS CI

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Build, Static Checks and Tests
        run: |
          mvn -B clean verify \
            -Dspotless.check.skip=false \
            -Dcheckstyle.skip=false \
            -Dpmd.skip=false \
            -Dspotbugs.skip=false
